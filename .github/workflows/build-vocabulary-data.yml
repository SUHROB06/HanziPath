name: Build vocabulary data assets

on:
  push:
    branches:
      - feature/complete-learning-platform
    paths:
      - scripts/build-vocabulary-catalog.py
      - scripts/test-vocabulary-data.py
      - public/data-attribution.html
      - .github/workflows/build-vocabulary-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocabulary-data-feature-complete-learning-platform
  cancel-in-progress: false

jobs:
  build-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-learning-platform
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate HSK 2.0, HSK 3.0 and translation assets
        run: |
          python scripts/build-vocabulary-catalog.py --old-candidates public/vocabulary-review.json

      - name: Validate generated data
        run: |
          python scripts/test-vocabulary-data.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vocabulary-catalog-hsk30.json public/vocabulary-catalog-hsk20.json public/vocabulary-translations-ru-uz.json public/vocabulary-examples-hsk20.json public/data-licenses
          if git diff --cached --quiet; then
            echo "Vocabulary assets are already up to date."
          else
            git commit -m "Build licensed HSK vocabulary data assets"
            git push origin HEAD:feature/complete-learning-platform
          fi
